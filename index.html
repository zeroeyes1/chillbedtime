<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<title>Night Stream</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one full-bleed canvas (a night stream: far bank at the top, a small board of stones in the middle,
   the shore along the bottom). Two quiet buttons float over the shore. Single deliberate theme: dark on every host. */
:root{
  --water-deep:#04070e;
  --water:#07101c;
  --ink:#c9d2e3;
  --ink-dim:rgba(201,210,227,.6);
  --ink-faint:rgba(201,210,227,.3);
  --paper:#f2d9a6;
  --glass:rgba(10,16,28,.8);
  --line:rgba(201,210,227,.14);
  --ok:#9fd3a8;
  --font-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-ui:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
  padding:0 !important;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--water-deep);color:var(--ink);
  font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
#shade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:.22;transition:opacity 1.2s ease}
#tut{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);display:flex;justify-content:center;pointer-events:none;padding:0 20px;opacity:0;transition:opacity 1.6s ease}
#tut.show{opacity:1}
#tut .card{max-width:480px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
#tut .step{font:13px var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}
#tut .text{font-family:var(--font-display);font-style:italic;font-size:clamp(27px,7vw,34px);color:var(--ink);line-height:1.3;text-wrap:balance;text-shadow:0 0 16px rgba(0,0,0,.8)}
#tut .sub{font:17px var(--font-ui);color:var(--ink-dim);line-height:1.5;max-width:36ch;text-wrap:balance}
#tut .nav{display:flex;gap:18px}
#tut .skip{pointer-events:auto;background:transparent;border:0;color:var(--ink-dim);font:14px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:12px 16px}
#tut .skip.go{color:var(--paper)}
#tut .skip:focus-visible{outline:1px solid var(--ink-dim);outline-offset:2px}
#toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 5vh);text-align:center;pointer-events:none;
  font-family:var(--font-display);font-size:clamp(26px,6.5vw,34px);color:var(--ink);opacity:0;transition:opacity 1.4s ease;
  text-shadow:0 0 18px rgba(242,217,166,.25),0 0 10px rgba(0,0,0,.9);padding:0 24px;text-wrap:balance}
#toast small{display:block;font-family:var(--font-ui);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px}
#toast small.line{font-family:var(--font-display);font-style:italic;font-size:21px;letter-spacing:0;text-transform:none;color:var(--ink-dim);margin:6px auto 0;max-width:30ch}
#toast.show{opacity:1}
#fork{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 116px);display:flex;flex-direction:column;align-items:center;gap:12px;opacity:0;pointer-events:none;transition:opacity 1s ease}
#fork.show{opacity:1}
#fork.show .row{pointer-events:auto}
#fork .lbl{font-family:var(--font-display);font-style:italic;font-size:clamp(23px,6vw,27px);color:var(--ink-dim);text-align:center;text-shadow:0 0 10px rgba(0,0,0,.9)}
#fork .row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
#fork .b{font-size:17px;padding:13px 20px;min-height:52px;background:rgba(4,7,14,.6)}
button.b{appearance:none;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:11px 16px;font:14px var(--font-ui);letter-spacing:.06em;cursor:pointer;min-height:44px}
button.b.gold{color:var(--paper);border-color:rgba(242,217,166,.5)}
button.b:disabled{opacity:.45;cursor:default}
button.b:focus-visible{outline:1px solid var(--ink-dim);outline-offset:2px}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:12px;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);opacity:.7;transition:opacity .6s}
#ui:hover,#ui:focus-within{opacity:.95}
#ui button{appearance:none;background:rgba(4,7,14,.5);border:1px solid var(--line);color:var(--ink-dim);border-radius:999px;
  padding:10px 18px;font:14px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;min-height:44px}
#ui button:focus-visible{outline:1px solid var(--ink-dim);outline-offset:2px}
#ui #bJournal.new::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--paper);margin-left:8px;vertical-align:middle}
#panel{position:fixed;inset:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 100px);
  -webkit-user-select:text;user-select:text;touch-action:pan-y}
#panel .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
#panel h1{font-family:var(--font-display);font-weight:400;font-size:40px;margin:0;letter-spacing:.01em;text-wrap:balance}
#panel h2{font:14px var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 10px;font-weight:500}
#panel p{margin:0;color:var(--ink-dim);line-height:1.6;font-size:17px;max-width:60ch}
#panel p.lead{color:var(--ink);font-family:var(--font-display);font-size:22px;font-style:italic;line-height:1.4}
[hidden]{display:none!important}
#panelClose{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:18px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,rgba(4,7,14,.92) 45%)}
#panelClose .b{background:rgba(4,7,14,.6)}
.follow{display:flex;flex-wrap:wrap;gap:8px}
.follow div{display:flex;flex-direction:column;align-items:center;gap:2px;width:76px}
.follow canvas{width:72px;height:45px}
.follow span{font-size:13px;color:var(--ink-dim);text-align:center;line-height:1.25}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.cr{display:flex;flex-direction:column;align-items:center;gap:5px;padding:12px 10px;border:1px solid var(--line);border-radius:12px;min-width:0;text-align:center}
.cr canvas{width:100px;height:62px;display:block}
.cr b{font-weight:400;font-size:17px;color:var(--ink);line-height:1.25}
.cr.unmet b{color:var(--ink-faint);letter-spacing:.2em}
.cr span{font-size:14.5px;color:var(--ink-dim);line-height:1.4}
.cr.unmet span{font-style:italic}
.toggles{display:flex;flex-wrap:wrap;gap:10px}
#night{position:fixed;inset:0;display:grid;place-items:center;background:#000;pointer-events:none;opacity:0;transition:opacity 4s ease}
#night.show{opacity:1}
#night p{font-family:var(--font-display);font-style:italic;font-size:clamp(26px,6vw,34px);color:rgba(201,210,227,.35);margin:0;text-align:center;padding:0 24px}
@media (prefers-reduced-motion: reduce){#toast,#shade,#night,#tut,#fork{transition-duration:.2s}}
</style>

<canvas id="c" aria-label="A night stream. Tap a stone to turn it and lead the water to the pools."></canvas>
<div id="shade"></div>
<div id="tut" aria-live="polite"></div>
<div id="toast" aria-live="polite"></div>
<div id="fork"><div class="lbl" id="forkL"></div><div class="row" id="forkB"></div></div>
<div id="night"><p>the stream is asleep &middot; goodnight</p></div>
<div id="ui" role="toolbar" aria-label="Controls">
  <button id="bJournal">Journal</button>
  <button id="bMore">More</button>
</div>
<div id="panel" hidden>
  <div class="wrap" id="panelWrap"></div>
</div>
<div id="panelClose" hidden><button class="b" id="bClose">Back to the stream</button></div>
<script>
(function(){
'use strict';
// ---------- helpers ----------
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const approach=(v,t,s)=>v<t?Math.min(t,v+s):Math.max(t,v-s);
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
const now=()=>performance.now();
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0);}
function seeded(seed){let x=seed||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return ((x>>>0)%100000)/100000;};}
function hexA(h,a){const n=parseInt(h.slice(1),16);return 'rgba('+(n>>16&255)+','+(n>>8&255)+','+(n&255)+','+a+')';}
const dbg={}; // test overrides: hour, rain, phase

// A "night" runs from 6am to 6am, so a 1am session is still the same night as the evening before.
const nightKey=(d=new Date())=>{const t=new Date(d.getTime()-6*3600e3);return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();};
const hourNow=()=>{if(dbg.hour!==undefined)return dbg.hour;const d=new Date();return d.getHours()+d.getMinutes()/60;};
const isLate=()=>{const h=hourNow();return h>=22.5||h<5;};
const isVeryLate=()=>hourNow()<5;
// the real moon: 0 new, .5 full
function moonPhase(){if(dbg.phase!==undefined)return dbg.phase;const syn=29.530588853,ref=Date.UTC(2000,0,6,18,14);const d=(Date.now()-ref)/864e5;return ((d%syn)+syn)%syn/syn;}
const isFull=()=>{const p=moonPhase();return p>.44&&p<.56;};
const isNewMoon=()=>{const p=moonPhase();return p<.05||p>.95;};

// ---------- persistence ----------
const KEY='night-stream-v1';
const defaults=()=>({v:1,met:{},nights:[],banks:0,played:0,sound:true,dim:1,tut:false,seen:{},jnew:false,lastSeen:0,tonight:null});
let save=defaults();
try{const raw=localStorage.getItem(KEY);if(raw){save=Object.assign(defaults(),JSON.parse(raw));}}catch(e){}
let resetting=false;
function persist(){if(resetting)return;try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const TONIGHT=nightKey();
const firstVisitTonight=!save.nights.includes(TONIGHT);
if(firstVisitTonight){save.nights.push(TONIGHT);if(save.nights.length>400)save.nights.shift();}
if(!save.tonight||save.tonight.night!==TONIGHT)save.tonight={night:TONIGHT,done:0,comp:[],fresh:0,ended:false,pond:null,kind:null,counted:false};
const T=()=>save.tonight;
const level=()=>save.played+(T().counted?0:1); // nights played, counting tonight
const rainNight=()=>dbg.rain!==undefined?dbg.rain:(hashStr(TONIGHT+'rain')%10<3);
const NIGHT_PONDS=10;

// ---------- creatures ----------
// k: kinds of water it comes to (r reeds, l lilies, s shallows, d deep). w: how common. sh: how it is drawn. mv: how it moves.
// late / early (half past ten), vlate (after midnight), rain, full, newm (no moon), after (only when that one follows you), metN.
const CR=[
 {id:'frog',n:'Green frog',line:'It sits very still, and then it doesn’t.',hint:'Reeds, lilies or the shallows.',k:'rls',w:10,sh:'frog',sz:.8,mv:'hop',c:'#5f8a4a',c2:'#4a6e3a',c3:'#b9c98a'},
 {id:'minnow',n:'Minnows',line:'A little shoal. They all turn at once.',hint:'Lilies, the shallows or deep water.',k:'lsd',w:9,sh:'shoal',sz:.95,mv:'swim',c:'#9aa6b4',c2:'#6d7a8a'},
 {id:'snail',n:'Pond snail',line:'It carries its house and is never late.',hint:'Lilies or the shallows.',k:'ls',w:8,sh:'snail',sz:.6,mv:'crawl',c:'#c8b890',c2:'#6a5236',c3:'#8a8070'},
 {id:'strider',n:'Water strider',line:'It walks on the water like it’s a floor.',hint:'Reeds or lilies.',k:'rl',w:8,sh:'strider',sz:.85,mv:'skate',c:'#4a4232',c2:'#7a7060'},
 {id:'whirligig',n:'Whirligig beetles',line:'They spin in circles and never get dizzy.',hint:'Lilies or the shallows.',k:'ls',w:7,sh:'whirl',sz:.7,mv:'skate',c:'#3e504e',c2:'#9fd0d0'},
 {id:'newt',n:'Smooth newt',line:'It has an orange belly it doesn’t show to everyone.',hint:'Reeds or lilies.',k:'rl',w:7,sh:'newt',sz:.85,mv:'swim',c:'#7a7050',c2:'#d0782e'},
 {id:'kohaku',n:'Kohaku koi',line:'White with red patches. It seems to know you.',hint:'Lilies or deep water.',k:'ld',w:7,sh:'koi',sz:1,mv:'swim',body:'#e9e3d6',marks:'#b8432b'},
 {id:'toad',n:'Toad',line:'It is in no hurry at all.',hint:'Reeds or the shallows.',k:'rs',w:6,sh:'frog',sz:.8,mv:'hop',c:'#7a6648',c2:'#5e4e36',c3:'#a89470',warts:true},
 {id:'damsel',n:'Damselfly',line:'Thin as a needle and bright blue.',hint:'Only in the reeds.',k:'r',w:6,sh:'dragonfly',sz:.75,mv:'fly',c:'#4a9ae0',c2:'#2a5a8a',thin:true},
 {id:'stickle',n:'Stickleback',line:'Small, spiny, and very proud of its nest.',hint:'Reeds or the shallows.',k:'rs',w:6,sh:'fish',sz:.6,mv:'swim',body:'#7a8a70',throat:'#c8603e',spines:true},
 {id:'ogon',n:'Gold koi',line:'A koi the colour of a lamp.',hint:'Lilies or deep water.',k:'ld',w:5,sh:'koi',sz:1,mv:'swim',body:'#d6b25c'},
 {id:'moth',n:'White moth',line:'It is looking for the moon.',hint:'Anywhere but deep water.',k:'rls',w:6,sh:'moth',sz:.65,mv:'fly',c:'#dcd6c6',c2:'#aca692'},
 {id:'beetle',n:'Diving beetle',line:'It carries a bubble of air under its wings.',hint:'Lilies or deep water.',k:'ld',w:4,sh:'beetle',sz:.6,mv:'swim',c:'#3a4230',c2:'#c8a858'},
 {id:'crayfish',n:'Crayfish',line:'It walks backwards, on purpose.',hint:'Only in the shallows.',k:'s',w:4,sh:'crayfish',sz:.85,mv:'crawl',c:'#7a4a32',c2:'#a8643e'},
 {id:'turtle',n:'Pond turtle',line:'It brought its own roof.',hint:'Lilies or the shallows.',k:'ls',w:4,sh:'turtle',sz:.95,mv:'swim',c:'#4e5638',c2:'#2e3424',c3:'#6a6e50'},
 {id:'vole',n:'Water vole',line:'A round face, nibbling a reed.',hint:'Only in the reeds.',k:'r',w:4,sh:'vole',sz:.75,mv:'swim',c:'#6a5440',c2:'#3e3022'},
 {id:'dragon',n:'Emperor dragonfly',line:'A big blue dragonfly. It can fly backwards.',hint:'Reeds or lilies, before half past ten.',k:'rl',w:4,sh:'dragonfly',sz:1.05,mv:'fly',c:'#4a9ad8',c2:'#4a8a4a',early:true},
 {id:'firefly',n:'Fireflies',line:'They blink to each other across the water.',hint:'Anywhere but deep water, before half past ten.',k:'rls',w:5,sh:'fireflies',sz:.9,mv:'fly',c:'#d6eca0',early:true},
 {id:'duck',n:'Ducklings',line:'A row of ducklings, all asleep but the last.',hint:'Lilies or the shallows, before half past ten.',k:'ls',w:3,sh:'ducklings',sz:1.1,mv:'swim',c:'#c0aa6a',c2:'#6a5a36',early:true},
 {id:'cnewt',n:'Crested newt',line:'A ragged crest down its back, like a very small dragon.',hint:'Reeds or deep water, after half past ten.',k:'rd',w:3,sh:'newt',sz:.95,mv:'swim',c:'#34322a',c2:'#d89a2a',crest:true,late:true},
 {id:'catfish',n:'Catfish',line:'Long whiskers. It tastes the water.',hint:'Deep water, after half past ten.',k:'d',w:3,sh:'fish',sz:1.1,mv:'swim',body:'#5a5a4c',whiskers:true,late:true},
 {id:'bat',n:'Bat',line:'It skims the water for a drink.',hint:'Deep water or the shallows, after half past ten.',k:'ds',w:3,sh:'bat',sz:.85,mv:'fly',c:'#3a3440',c2:'#544a5a',late:true},
 {id:'treefrog',n:'Tree frog',line:'Tiny and bright green, with sticky toes.',hint:'Lilies or reeds, when it rains.',k:'lr',w:4,sh:'frog',sz:.6,mv:'hop',c:'#6ac04a',c2:'#4a9a36',c3:'#d8e8a0',rain:true},
 {id:'eel',n:'Eel',line:'It came here from very far away.',hint:'Deep water, when it rains.',k:'d',w:3,sh:'eel',sz:1.3,mv:'swim',c:'#4a4a34',c2:'#7a7a58',rain:true},
 {id:'kingfisher',n:'Kingfisher',line:'A flash of blue and orange.',hint:'Reeds or the shallows. It follows minnows.',k:'rs',w:3,sh:'kingfisher',sz:.8,mv:'fly',c:'#2a8ac0',c2:'#d0763a',after:'minnow'},
 {id:'heron',n:'Grey heron',line:'Standing on one leg, thinking.',hint:'Reeds or the shallows, when a frog is with you.',k:'rs',w:3,sh:'heron',sz:1.45,mv:'wade',c:'#8a929e',c2:'#4a4e58',c3:'#c8b060',after:'frog'},
 {id:'otter',n:'Otter',line:'It floats on its back and looks at you.',hint:'Deep water or reeds. It follows crayfish.',k:'dr',w:3,sh:'otter',sz:1.3,mv:'swim',c:'#5e4834',c2:'#9a8068',after:'crayfish'},
 {id:'axolotl',n:'Axolotl',line:'It smiles like it knows a secret.',hint:'Lilies or deep water, after half past ten.',k:'ld',w:2,sh:'newt',sz:.9,mv:'swim',c:'#e8a8b0',c2:'#d0606e',gills:true,late:true},
 {id:'luna',n:'Luna moth',line:'Pale green, with long trailing tails.',hint:'Lilies or reeds, after half past ten.',k:'lr',w:2,sh:'moth',sz:.95,mv:'fly',c:'#b8d8a8',c2:'#8aa878',tails:true,late:true},
 {id:'mooncarp',n:'Moon carp',line:'It glows like the moon, and only comes when the moon is full.',hint:'Deep water, when the moon is full.',k:'d',w:4,sh:'koi',sz:1.2,mv:'swim',body:'#dfe7f7',glow:'#bcd0ff',full:true,magic:true},
 {id:'lmoth',n:'Lantern moth',line:'A moth that carries its own small light.',hint:'Reeds or lilies. It follows fireflies.',k:'rl',w:3,sh:'moth',sz:.8,mv:'fly',c:'#e8c88a',c2:'#b08a4a',glow:'#ffcf80',after:'firefly',magic:true},
 {id:'crane',n:'Paper crane',line:'Folded by someone long ago. It floats.',hint:'Lilies, on a night with no moon.',k:'l',w:4,sh:'crane',sz:.95,mv:'drift',c:'#e8e0d0',c2:'#bcb09a',newm:true,magic:true},
 {id:'starnewt',n:'Star newt',line:'Stars on its back. Nobody knows where it goes by day.',hint:'Reeds, late on a rainy night.',k:'r',w:3,sh:'newt',sz:.9,mv:'swim',c:'#1a2244',c2:'#b4c4ff',glow:'#7f94e0',stars:true,late:true,rain:true,magic:true},
 {id:'ghost',n:'Ghost koi',line:'You see it best from the corner of your eye.',hint:'Deep water, after midnight.',k:'d',w:3,sh:'koi',sz:1,mv:'swim',body:'#8e97a8',marks:'#f0f2f6',glow:'#dfe6f5',ghost:true,vlate:true,magic:true},
 {id:'wisp',n:'Wisp',line:'A small wandering light. It goes a little way ahead, then waits.',hint:'Reeds or the shallows. It follows lantern moths.',k:'rs',w:3,sh:'wisp',sz:.75,mv:'drift',c:'#cfe4ff',glow:'#a8c8ff',after:'lmoth',magic:true},
 {id:'oldturtle',n:'The old turtle',line:'Moss on its shell. It has seen every night this water has had.',hint:'The shallows or deep water, once you have met twenty others.',k:'sd',w:4,sh:'turtle',sz:1.45,mv:'swim',c:'#4a5a3a',c2:'#2a3424',c3:'#6a6a50',moss:'#7a9a5a',metN:20,magic:true},
];
const CRM=Object.fromEntries(CR.map(s=>[s.id,s]));
const KINDS={r:'reeds',l:'lilies',s:'shallows',d:'deep'};
const KIND_WORDS={reeds:'Toward the reeds',lilies:'Toward the lilies',shallows:'Toward the shallows',deep:'Toward the deep water'};
function eligible(sp,kind,comp){
  if(!sp.k.includes(kind[0]))return false;
  if(sp.late&&!isLate())return false;if(sp.early&&isLate())return false;if(sp.vlate&&!isVeryLate())return false;
  if(sp.rain&&!rainNight())return false;if(sp.full&&!isFull())return false;if(sp.newm&&!isNewMoon())return false;
  if(sp.after&&!comp.includes(sp.after))return false;if(sp.metN&&Object.keys(save.met).length<sp.metN)return false;
  return true;
}
function pickCreature(kind,exclude,wantNew){
  const comp=T().comp;
  let pool=CR.filter(s=>eligible(s,kind,comp)&&!exclude.includes(s.id));
  if(wantNew){const un=pool.filter(s=>!save.met[s.id]);if(un.length)pool=un;}
  if(!pool.length)pool=CR.filter(s=>!exclude.includes(s.id)&&eligible(s,s.k[0],comp));
  if(!pool.length)return CRM.frog;
  const ws=pool.map(s=>s.w*(save.met[s.id]?1:1.3)*(comp.includes(s.id)?.6:1));
  let r=Math.random()*ws.reduce((a,b)=>a+b,0);
  for(let i=0;i<pool.length;i++){r-=ws[i];if(r<=0)return pool[i];}
  return pool[0];
}

// ---------- creature drawing ----------
// Every creature is drawn seen from above, facing right, about L long. P turns a colour into what to paint:
// the real colour, a dark shadow (waiting in a pool), or a soft outline (not met yet, in the journal).
const SHADOW='#080c16';
function paint(mode){const f=mode==='real'?(c=>c):mode==='j'?(()=>'rgba(78,90,120,.85)'):(()=>SHADOW);f.real=mode==='real';return f;}
const PR=paint('real'),PS=paint('s'),PJ=paint('j');
const ell=(x,cx,cy,rx,ry,rot=0)=>{x.beginPath();x.ellipse(cx,cy,Math.max(.1,rx),Math.max(.1,ry),rot,0,TAU);x.fill();};
const seg=(x,a,b,c,d)=>{x.beginPath();x.moveTo(a,b);x.lineTo(c,d);x.stroke();};
function pw(u,k){for(let i=1;i<k.length;i++){if(u<=k[i][0]){const a=k[i-1],b=k[i];return a[1]+(b[1]-a[1])*(u-a[0])/(b[0]-a[0]);}}return k[k.length-1][1];}
function worm(x,L,prof,amp,t,ph,fill,n=18){const pts=[];for(let i=0;i<=n;i++){const u=i/n;pts.push([L*(.5-u),Math.sin(t*2.4+ph-u*4.2)*amp*L*u,pw(u,prof)*L]);}
  x.fillStyle=fill;x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(const p of pts)x.lineTo(p[0],p[1]-p[2]);for(let i=n;i>=0;i--)x.lineTo(pts[i][0],pts[i][1]+pts[i][2]);x.closePath();x.fill();return pts;}
function koiPts(L,k){const pts=[];for(let i=0;i<=12;i++){const u=i/12;const w=L*.2*Math.sin(Math.pow(u,.78)*Math.PI)*(1-u*.3)+L*.012;pts.push([-(u-.5)*L,Math.sin(k.wig-u*3.2)*.12*L*(u*.6+.1),w]);}return pts;}
function koiBody(x,pts,L,fill){x.fillStyle=fill;x.beginPath();x.moveTo(pts[0][0]+L*.02,pts[0][1]);
  for(const p of pts)x.lineTo(p[0],p[1]-p[2]);
  const tl=pts[12];x.quadraticCurveTo(tl[0]-L*.16,tl[1]-L*.08,tl[0]-L*.3,tl[1]-L*.2);x.quadraticCurveTo(tl[0]-L*.2,tl[1]-L*.03,tl[0]-L*.14,tl[1]);
  x.quadraticCurveTo(tl[0]-L*.2,tl[1]+L*.03,tl[0]-L*.3,tl[1]+L*.2);x.quadraticCurveTo(tl[0]-L*.16,tl[1]+L*.08,tl[0],tl[1]+tl[2]);
  for(let i=12;i>=0;i--)x.lineTo(pts[i][0],pts[i][1]+pts[i][2]);x.closePath();x.fill();}
function koiFins(x,pts,L,fill){x.fillStyle=fill;
  const p=pts[3],q=pts[8];
  for(const g of [-1,1]){x.beginPath();x.moveTo(p[0],p[1]+g*p[2]*.5);x.quadraticCurveTo(p[0]-L*.1,p[1]+g*(p[2]+L*.13),p[0]-L*.24,p[1]+g*(p[2]+L*.04));x.quadraticCurveTo(p[0]-L*.12,p[1]+g*p[2]*.75,p[0],p[1]+g*p[2]*.5);x.fill();
    x.beginPath();x.moveTo(q[0],q[1]+g*q[2]*.5);x.quadraticCurveTo(q[0]-L*.06,q[1]+g*(q[2]+L*.07),q[0]-L*.14,q[1]+g*(q[2]+L*.02));x.quadraticCurveTo(q[0]-L*.07,q[1]+g*q[2]*.7,q[0],q[1]+g*q[2]*.5);x.fill();}}
function koiClip(x,pts){x.beginPath();x.moveTo(pts[0][0],pts[0][1]);for(const p of pts)x.lineTo(p[0],p[1]-p[2]);for(let i=12;i>=0;i--)x.lineTo(pts[i][0],pts[i][1]+pts[i][2]);x.closePath();x.clip();}
function koiMarks(x,pts,L,s){
  const patch=(u,len,wid,fill)=>{const i=Math.round(u*12),p=pts[i],q=pts[Math.min(12,i+1)];const ang=Math.atan2(q[1]-p[1],q[0]-p[0]);
    x.save();x.translate(p[0],p[1]);x.rotate(ang);x.fillStyle=fill;x.beginPath();x.ellipse(0,0,L*len,p[2]*wid,0,0,TAU);x.fill();x.restore();};
  if(s.marks){for(const u of [.24,.6])patch(u,.11,1.02,s.marks);patch(.84,.06,.9,s.marks);}
  if(s.throat)patch(.12,.06,.8,s.throat);
  x.strokeStyle='rgba(0,0,0,.14)';x.lineWidth=L*.012;x.beginPath();x.moveTo(pts[1][0],pts[1][1]);for(let i=2;i<=12;i++)x.lineTo(pts[i][0],pts[i][1]);x.stroke();
}
function shKoi(x,s,L,P,t,ph){const pts=koiPts(L,{wig:t*2.2+ph});const b=P(s.body);koiFins(x,pts,L,b);koiBody(x,pts,L,b);
  if(P.real){x.save();koiClip(x,pts);koiMarks(x,pts,L,s);x.restore();x.fillStyle='rgba(255,255,255,.12)';ell(x,pts[2][0],pts[2][1]-pts[2][2]*.35,L*.14,L*.04);}
  if(s.whiskers){x.strokeStyle=P(s.body);x.lineWidth=Math.max(1,L*.014);for(const g of[-1,1]){x.beginPath();x.moveTo(pts[0][0],pts[0][1]+g*L*.02);x.quadraticCurveTo(pts[0][0]+L*.12,pts[0][1]+g*L*.08,pts[0][0]+L*.05,pts[0][1]+g*L*.2);x.stroke();}}
  if(s.spines){x.fillStyle=P(s.body);for(const i of[3,5,7]){const p=pts[i];x.beginPath();x.moveTo(p[0]-L*.03,p[1]);x.lineTo(p[0]+L*.02,p[1]-L*.07);x.lineTo(p[0]+L*.03,p[1]);x.fill();}}}

  if(P.real){x.fillStyle=s.c3;ell(x,-L*.05,0,L*.18,L*.035);x.fillStyle='#14140e';for(const g of[-1,1])ell(x,L*.265,g*L*.105,L*.028,L*.028);
    if(s.warts){x.fillStyle=s.c2;for(let i=0;i<9;i++){const a=i*2.4,r=L*(.06+((i*37)%10)/100);ell(x,-L*.03+Math.cos(a)*r,Math.sin(a)*r*.8,L*.02,L*.02);}}}}
const NEWT=[[0,.015],[.06,.055],[.12,.06],[.19,.04],[.28,.058],[.48,.055],[.6,.038],[1,.002]];
function shNewt(x,s,L,P,t,ph){x.fillStyle=P(s.c);const pts=worm(x,L,NEWT,.12,t,ph,P(s.c));x.fillStyle=P(s.c);

// ---------- audio ----------
// Warm, woolly bed: five detuned low voices that swell on their own slow tides (20-40 s),
// drifting between four related chords. A dark generated reverb washes everything.
// Distant rain is filtered noise that gusts slowly. Player sounds pick chord tones so nothing clashes.
let AC=null,master=null,reverb=null,padBus=null,rainGain=null,padGain=null;
const TONES=10; // input maps to one of ten chord tones
const CHORDS=[
  [98.00,146.83,196.00,246.94,293.66],  // G  D  G  B  D
  [82.41,123.47,196.00,246.94,329.63],  // E  B  G  B  E
  [65.41,130.81,196.00,246.94,293.66],  // C  C  G  B  D
  [73.42,146.83,220.00,293.66,329.63],  // D  D  A  D  E
];
let chordI=0,voices=[],audioTimers=[];
let rainMul=rainNight()?2.2:1;
function chordTones(){const c=CHORDS[chordI];const t=[];for(const f of c){t.push(f*2,f*4);}t.sort((a,b)=>a-b);return t.filter(f=>f>=150&&f<=900).slice(0,10);}
function makeReverb(){
  const len=Math.floor(AC.sampleRate*3),buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let lp=0;
    for(let i=0;i<len;i++){const t=i/len;const env=Math.pow(1-t,2.2)*Math.exp(-t*2.5);
      lp+=( (Math.random()*2-1)-lp)*.18; // one-pole lowpass: darker tail

}
function makeNoise(){
  const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.997*b0+.029*w;b1=.985*b1+.032*w;b2=.95*b2+.048*w;d[i]=(b0+b1+b2+w*.05)*.6;} // pinkish

function ensureAudio(){
  if(AC)return true;

    master=AC.createGain();master.gain.value=0;master.connect(comp);comp.connect(AC.destination);

    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.017;lg.gain.value=160;lfo.connect(lg);lg.connect(padBus.frequency);lfo.start();
    padGain=AC.createGain();padGain.gain.value=1;padBus.connect(padGain);padGain.connect(master);
    const padSend=AC.createGain();padSend.gain.value=.55;padGain.connect(padSend);padSend.connect(reverb);
    // voices
    const c=CHORDS[0];
    for(let i=0;i<5;i++){
      const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=380+i*90;f.Q.value=.3;
      const g=AC.createGain();g.gain.value=0;f.connect(g);g.connect(padBus);
      const o1=AC.createOscillator(),o2=AC.createOscillator(),o3=AC.createOscillator();
      o1.type='triangle';o2.type='sawtooth';o3.type='sine';
      o1.frequency.value=c[i];o2.frequency.value=c[i];o3.frequency.value=c[i]*.5;
      o1.detune.value=-6;o2.detune.value=7;
      const sg=AC.createGain();sg.gain.value=.22;o2.connect(sg);sg.connect(f);o1.connect(f);
      const bg=AC.createGain();bg.gain.value=i<2?.5:0;o3.connect(bg);bg.connect(f);
      o1.start();o2.start();o3.start();
      voices.push({o:[o1,o2,o3],g,note:i,quiet:true});
    }
    // distant rain: pinkish noise, far away (lowpassed), gusting slowly
    const rain=makeNoise();const hp=AC.createBiquadFilter();hp.type='highpass';hp.frequency.value=260;
    const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=1100;lp.Q.value=.4;
    const rl=AC.createOscillator(),rlg=AC.createGain();rl.frequency.value=.023;rlg.gain.value=350;rl.connect(rlg);rlg.connect(lp.frequency);rl.start();

}
function later(fn,ms){audioTimers.push(setTimeout(fn,ms));}
function scheduleTides(){
  voices.forEach((v,i)=>{const go=()=>{if(!AC)return;const t=AC.currentTime;
    const up=rnd(10,20),hold=rnd(4,14),down=rnd(12,22),rest=rnd(4,16);
    const peak=rnd(.035,.07)*(i<2?.9:1);
    // retune while quiet so the glide is inaudible
    const f=CHORDS[chordI][v.note];v.o[0].frequency.setTargetAtTime(f,t,.5);v.o[1].frequency.setTargetAtTime(f,t,.5);v.o[2].frequency.setTargetAtTime(f*.5,t,.5);

    v.g.gain.linearRampToValueAtTime(peak,t+up);v.g.gain.setValueAtTime(peak,t+up+hold);v.g.gain.linearRampToValueAtTime(.0001,t+up+hold+down);

function scheduleGusts(){const go=()=>{if(!AC)return;rainGain.gain.setTargetAtTime(rnd(.012,.04)*rainMul,AC.currentTime,rnd(3,7));later(go,rnd(6000,16000));};later(go,4000);}

  save.sound=on;persist();

}
// Player sounds: soft, slow-attack tones taken from the current chord, mostly heard through the reverb.
let chimeTimes=[];
function chime(idx,vel=1,dur=3){

  const nowT=AC.currentTime;chimeTimes=chimeTimes.filter(x=>nowT-x<.4);if(chimeTimes.length>=5)return;chimeTimes.push(nowT);
  const tones=chordTones();const f=tones[clamp(Math.round(idx),0,tones.length-1)];

  const g=AC.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.09*vel,t+.09);g.gain.exponentialRampToValueAtTime(.0001,t+dur);

  const o2=AC.createOscillator();o2.type='triangle';o2.frequency.value=f;o2.detune.value=5;
  const g2=AC.createGain();g2.gain.value=.35;
  o.connect(lp);o2.connect(g2);g2.connect(lp);lp.connect(g);

  const wet=AC.createGain();wet.gain.value=.9;g.connect(wet);wet.connect(reverb);

function chord(baseIdx){chime(baseIdx,.8,4.5);setTimeout(()=>chime(baseIdx+2,.6,4.2),260);setTimeout(()=>chime(baseIdx+4,.5,4),560);}
// a stone turning: a short, low, muffled knock
function knock(){
  if(!AC||!save.sound||AC.state==='closed')return;
  const t=AC.currentTime+.01;const o=AC.createOscillator();o.type='sine';o.frequency.setValueAtTime(chordTones()[0]*.5,t);o.frequency.exponentialRampToValueAtTime(chordTones()[0]*.42,t+.18);

// ---------- canvas ----------
const cv=$('c'),ctx=cv.getContext('2d');
let W=1,H=1,DPR=1,stars=null,shoreTop=0,Smin=1,bankY=44;

// ---------- the board ----------
// Cells are stepping stones with grooves. Sides: N 1, E 2, S 4, W 8. A stone's grooves are its base shape turned r quarter turns.
const DX={1:0,2:1,4:0,8:-1},DY={1:-1,2:0,4:1,8:0},OPP={1:4,2:8,4:1,8:2},SIDES=[1,2,4,8];
const rotm=(m,r)=>{for(let i=0;i<(r&3);i++)m=((m<<1)&15)|(m>>3);return m;};
const bits=m=>(m&1)+(m>>1&1)+(m>>2&1)+(m>>3&1);
let pond=null,cell=50,bx=0,by=0,sprite=null,spriteFor=0;
const maskOf=c=>c.stone?rotm(c.b,c.r):0;
function nb(i,d){const x=i%pond.cols+DX[d],y=Math.floor(i/pond.cols)+DY[d];if(x<0||y<0||x>=pond.cols||y>=pond.rows)return -1;return y*pond.cols+x;}
const cellX=i=>bx+(i%pond.cols+.5)*cell,cellY=i=>by+(Math.floor(i/pond.cols)+.5)*cell;
function sidePos(i,d,f=.98){return {x:cellX(i)+DX[d]*cell*f,y:cellY(i)+DY[d]*cell*f};}
const poolPos=p=>sidePos(p.c,p.side);
const springPos=()=>sidePos(pond.sc,1);

function layout(){
  if(!pond)return;
  const top=bankY+64,bottom=shoreTop-150,aw=W-24,ah=bottom-top;
  cell=Math.max(30,Math.min(aw/(pond.cols+1.9),ah/(pond.rows+1.9),78));
  bx=(W-cell*pond.cols)/2;by=top+(ah-cell*pond.rows)/2;

// a stone, drawn once per size
function makeSprite(){
  if(spriteFor===cell&&sprite)return;spriteFor=cell;
  const R=cell*.41,s=Math.ceil(cell*1.1);sprite=document.createElement('canvas');sprite.width=Math.ceil(s*DPR);sprite.height=Math.ceil(s*DPR);
  const x=sprite.getContext('2d');x.scale(DPR,DPR);x.translate(s/2,s/2);
  x.fillStyle='rgba(0,0,0,.4)';ell(x,R*.06,R*.12,R*1.02,R*.98);
  const g=x.createRadialGradient(-R*.35,-R*.4,R*.1,0,0,R);g.addColorStop(0,'#323c52');g.addColorStop(.7,'#1f2737');g.addColorStop(1,'#171d2a');

function genPond(sp){
  const {cols,rows}=sp,n=cols*rows;let R=seeded(sp.seed);
  let best=null;
  for(let att=0;att<300;att++){
    const tm=sp.dfs?treeDFS(cols,rows,R):treePrim(cols,rows,R);
    const sc=Math.floor(R()*cols);
    const slots=[];for(let y=0;y<rows;y++){slots.push({c:y*cols,side:8},{c:y*cols+cols-1,side:2});}for(let x=0;x<cols;x++)slots.push({c:(rows-1)*cols+x,side:4});

    const minD=Math.max(2,Math.floor((cols+rows)/2)-1);
    const cand=slots.filter(s=>s.c!==sc&&md(s.c,sc)>=minD);
    for(let i=cand.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[cand[i],cand[j]]=[cand[j],cand[i]];}
    const pools=[];for(const s of cand){if(pools.length>=sp.pools)break;if(pools.every(p=>p.c!==s.c&&md(p.c,s.c)>=2))pools.push(s);}

    const par=new Array(n).fill(-1),pd=new Array(n).fill(0),seen=new Array(n).fill(false),q=[sc];seen[sc]=true;

  }
  if(!best){sp.cross=true;sp.pools=Math.max(1,sp.pools-1);return genPond(sp);}
  const {sc,pools,net}=best;
  const cells=[];
  for(let i=0;i<n;i++){

  shuffle(netIdx);

  if(sp.twin&&netIdx.length-k>=4){const a=cells[netIdx[k++]],b=cells[netIdx[k++]];a.twin=b.twin=true;const r=(isStraight(a)||isStraight(b))?(R()<.5?1:3):1+Math.floor(R()*3);a.r=b.r=r;}

function treePrim(cols,rows,R){const n=cols*rows,m=new Array(n).fill(0),inT=new Array(n).fill(false),fr=[];

const comps=[],ripples=[],decor=[];

// ---------- update ----------
function update(dt){
  const t=simT;phaseT+=dt;
  if(pond){const target=(phase==='out'||phase==='rest'||pond.away)?0:1;pond.fade=approach(pond.fade,target,dt/(target?1.1:.8));}
  if(phase==='out'&&(!pond||pond.fade<=0)){newPond(nextKind||pick(['reeds','lilies','shallows','deep']),false);chime(1,.35,4);}
  else if(phase==='in'&&pond&&pond.fade>=1){phase='play';phaseT=0;lastTouch=simT;recompute();introduce();if(tutPending&&!tut.on){tutPending=false;tutStart();}}
  if(phase==='play'){
    for(const c of pond.cells){if(c.pending&&t>=c.fillAt){c.pending=false;chime(clamp(1+c.depth*.7,0,9),.42,2.6);addRipple(cellX(pond.cells.indexOf(c)),cellY(pond.cells.indexOf(c)),.35);}}
    pond.pools.forEach((p,k)=>{if(p.reached&&!p.chimed&&t>=p.reachAt){p.chimed=true;chord(3+k);const pp=poolPos(p);addRipple(pp.x,pp.y,.9);}});
    if(pond.allReached&&t>=pond.solveAt)onSolved();
    // a waiting shape is very patient, but if the pond is left alone for a few minutes one drifts off
    if(!tut.on&&$('panel').hidden&&t-lastTouch>180){lastTouch=t;const cand=pond.pools.filter(p=>!p.reached&&!p.leaving&&p.alpha>.9);
      if(cand.length){const p=pick(cand);p.leaving=true;p.backAt=t+16;}}
    for(const p of pond.pools){if(p.leaving){p.alpha=approach(p.alpha,0,dt/4);if(p.alpha<=0&&t>=p.backAt){p.leaving=false;p.cr=pickCreature(pond.kind,pond.pools.map(q=>q.cr),false).id;persistPond();}}
      else p.alpha=approach(p.alpha,1,dt/4);}
  }
  if(phase==='solved'){
    pond.lit=approach(pond.lit,1,dt/1.2);pond.pulse+=dt;
    pond.pools.forEach((p,k)=>{const st=.6+k*.8;
      if(phaseT>st&&!p.gone){p.vis=approach(p.vis,1,dt/1.8);
        if(p.vis>.55&&!p.announced){p.announced=true;const sp=CRM[p.cr];chord(4+k*2);const pp=poolPos(p);addRipple(pp.x,pp.y,1.2);if(p.isNew)toast(sp.n,sp.line,true);}}
      if(phaseT>st+2.6&&!p.gone){p.gone=true;leavePool(p);}});
    if(phaseT>4.6&&shoreShown<Math.min(NIGHT_PONDS,T().done)){shoreShown=Math.min(NIGHT_PONDS,T().done);shoreFade=0;chime(7,.35,4);}

  }

  if(phase==='rest'){
    if(restStage===0&&phaseT>1.2){restStage=1;toast('The stream reaches a quiet pool','everyone who followed you tonight is here');chord(2);}
    if(restStage===1&&phaseT>7){restStage=2;bankShown=save.banks;bankFade=0;chord(5);toast('A lantern on the far bank is lit','one for every night you reach the quiet pool');}
    if(restStage===2&&phaseT>13){restStage=3;showRestChoice();}
  }
  restA=approach(restA,phase==='rest'?1:0,dt/2.5);
  shoreFade=approach(shoreFade,1,dt/2);bankFade=approach(bankFade,1,dt/3);
  if(pond){
    for(const c of pond.cells){c.wet=approach(c.wet,c.pending?0:c.wetT,dt*3);c.bump=approach(c.bump,0,dt*4);
      const target=(c.rt||0)*Math.PI/2;c.ang+= (target-c.ang)*Math.min(1,dt*14);if(Math.abs(target-c.ang)<.002)c.ang=target;}

  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];r.r+=r.speed*dt;if(t-r.born>r.life)ripples.splice(i,1);}

}

function drawMoon(t){

  const c=hitComp(px,py);
  if(c){c.label=2.5;if(c.sp.mv==='hop'){c.hopping=.35;c.hopT=rnd(1.6,4);}chime(5,.3,2.5);addRipple(c.x,c.y,.6);return;}
  if(py>bankY&&py<shoreTop)addRipple(px,py,.7);
}
cv.addEventListener('pointerup',endPress);cv.addEventListener('pointercancel',endPress);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('touchstart',e=>{e.preventDefault();},{passive:false});
cv.addEventListener('touchmove',e=>{e.preventDefault();},{passive:false});

// ---------- settings ----------
const DIMS=[0,.22,.42,.6];
function applyDim(){$('shade').style.opacity=candle?'':DIMS[save.dim];}
let candle=null;const CANDLE_MIN=10;
function toggleCandle(){
  if(candle){candle=null;slow=1;applyDim();toast('Candle relit');return;}
  candle={start:now()};toast('The candle is lit','the stream fades over ten minutes');
}
function tickCandle(){
  if(!candle)return;
  const u=clamp((now()-candle.start)/(CANDLE_MIN*60e3),0,1);
  $('shade').style.opacity=lerp(DIMS[save.dim],.97,u*u);
  slow=lerp(1,.25,u);
  if(AC&&master&&save.sound)master.gain.setTargetAtTime(.9*(1-u*.9),AC.currentTime,2);
  if(u>=1)sleep();
}
setInterval(tickCandle,1000);
function sleep(){asleep=true;running=false;candle=null;$('night').classList.add('show');$('ui').style.opacity='0';
  if(AC&&master)master.gain.setTargetAtTime(0,AC.currentTime,3);
  try{if(wakeLock){wakeLock.release();wakeLock=null;}}catch(e){}}
function wake(){asleep=false;slow=1;$('night').classList.remove('show');$('ui').style.opacity='';applyDim();
  if(AC&&save.sound)master.gain.setTargetAtTime(.9,AC.currentTime,2);
  if(!running){running=true;tPrev=now();requestAnimationFrame(loop);}requestWake();}
let wakeLock=null;
async function requestWake(){try{if('wakeLock' in navigator&&!wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null;});}}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&!asleep)requestWake();});

// ---------- panels ----------
const wrap=$('panelWrap');
function openPanel(kind){
  let h='';
  if(kind==='journal'){
    save.jnew=false;persist();updateBar();
    const met=CR.filter(s=>save.met[s.id]).length,t=T();
    h+='<h1>Journal</h1><p class="lead">'+esc(tonightLine())+'</p>';
    if(t.comp.length)h+='<div><h2>Following you tonight</h2><div class="follow" id="follow"></div></div>';
    h+='<div><h2>Met &middot; '+met+' of '+CR.length+'</h2><p>The ones you haven’t met yet are dark shapes, each with a clue. Pick the way at each fork to go looking.</p></div><div class="cards" id="cards"></div>';
  }else if(kind==='more'){
    h+='<h1>More</h1><div class="toggles">'+
      '<button class="b'+(save.sound?' gold':'')+'" id="mSound">Sound '+(save.sound?'on':'off')+'</button>'+
      '<button class="b" id="mDim">Dim: '+['off','a little','more','most'][save.dim]+'</button>'+
      '<button class="b'+(candle?' gold':'')+'" id="mCandle">'+(candle?'Relight the candle':'Light the candle')+'</button>'+
      '<button class="b" id="mTour">Show me how to play</button></div>'+
      '<p>Tap a stone to turn it. Turn stones until the water reaches every pool, and whoever was waiting follows you for the night. Ten ponds reach the quiet pool. You can keep going after that.</p>'+
      '<p>Sound is slow and soft, with faraway rain. It starts when you first touch the screen. The candle slowly fades everything to black over ten minutes so you can fall asleep with it.</p>'+
      '<div><h2>Start over</h2><p>Clears everything: who you’ve met, the far bank lanterns, and tonight.</p><div class="toggles" style="margin-top:10px"><button class="b" id="mReset">Start over</button></div></div>';
  }
  wrap.innerHTML=h;
  if(kind==='journal'){
    const fl=$('follow');if(fl)for(const id of T().comp){const sp=CRM[id];const d=document.createElement('div');d.appendChild(thumb(sp,true,72,45));const s=document.createElement('span');s.textContent=sp.n;d.appendChild(s);fl.appendChild(d);}
    const cards=$('cards');for(const sp of CR){const m=!!save.met[sp.id];const d=document.createElement('div');d.className='cr'+(m?'':' unmet');
      d.appendChild(thumb(sp,m));const b=document.createElement('b');b.textContent=m?sp.n:'· · ·';d.appendChild(b);const s=document.createElement('span');s.textContent=m?sp.line:sp.hint;d.appendChild(s);cards.appendChild(d);}
  }
  if(kind==='more'){
    $('mSound').addEventListener('click',()=>{setSound(!save.sound);openPanel('more');});
    $('mDim').addEventListener('click',()=>{save.dim=(save.dim+1)%DIMS.length;persist();applyDim();openPanel('more');});
    $('mCandle').addEventListener('click',()=>{toggleCandle();closePanel();});
    $('mTour').addEventListener('click',()=>{closePanel();tutStart();if(tutPending)toast('The tour starts with the next pond');});
    $('mReset').addEventListener('click',()=>{const b=$('mReset');if(b.dataset.arm){resetting=true;try{localStorage.removeItem(KEY);}catch(e){}b.textContent='Starting over…';setTimeout(()=>location.reload(),150);}else{b.dataset.arm='1';b.textContent='Tap again to really start over';}});
  }
  $('panel').hidden=false;$('panelClose').hidden=false;$('panel').scrollTop=0;
}
function closePanel(){$('panel').hidden=true;$('panelClose').hidden=true;lastTouch=simT;}
$('bClose').addEventListener('click',closePanel);
$('bJournal').addEventListener('click',()=>openPanel('journal'));
$('bMore').addEventListener('click',()=>openPanel('more'));

// ---------- boot ----------
addEventListener('resize',resize);
resize();
applyDim();updateBar();
addEventListener('pointerdown',function arm(){if(save.sound)setSound(true);removeEventListener('pointerdown',arm);},{once:true});
{
  const t=T();
  if(t.pond){pond=loadPond(t.pond);layout();phase='in';}
  else if(!save.tut&&t.done===0)newPond('lilies',true);
  else newPond(t.kind&&t.done?pick(['reeds','lilies','shallows','deep']):'lilies',false);
  spawnComps();
}
if(!save.tut)setTimeout(tutStart,1600);
else setTimeout(()=>{const extra=rainNight()?'soft rain tonight':isFull()?'the moon is full':isNewMoon()?'no moon tonight':'';
  if(firstVisitTonight)toast('A new night',extra||'ten ponds to the quiet pool');else toast('Welcome back',extra);},1200);
setInterval(()=>{save.lastSeen=Date.now();persist();},30000);
requestWake();
requestAnimationFrame(loop);
window.__ns={save,CR,dbg,get pond(){return pond;},get phase(){return phase;},get comps(){return comps;},get tut(){return tut;},
  geo:()=>({bx,by,cell,W,H}),cellCenter:i=>({x:cellX(i),y:cellY(i)}),openPanel,flow:()=>flow(),
  step:(s)=>{for(let i=0;i<s*30;i++){simT+=1/30;update(1/30);}}};
})();
</script>
