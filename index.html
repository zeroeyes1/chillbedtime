<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#05080f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
</head>
<body>
<title>Lantern Pond</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: one full-bleed canvas (the pond, with a shore along the bottom). Four quiet buttons float over the shore.
   Single deliberate theme: this is a night pond, dark on every host. */
:root{
  --water-deep:#04070e;
  --water:#07101c;
  --ink:#c9d2e3;
  --ink-dim:rgba(201,210,227,.6);
  --ink-faint:rgba(201,210,227,.3);
  --paper:#f2d9a6;
  --glass:rgba(10,16,28,.8);
  --line:rgba(201,210,227,.14);
  --ok:#9fd3a8;
  --font-display:"Cormorant Garamond", Georgia, "Times New Roman", serif;
  --font-ui:ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme:dark;
  padding:0 !important;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--water-deep);color:var(--ink);
  font-family:var(--font-ui);-webkit-tap-highlight-color:transparent;overscroll-behavior:none;touch-action:none;
  -webkit-user-select:none;user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;-webkit-touch-callout:none}
#shade{position:fixed;inset:0;background:#000;pointer-events:none;opacity:.22;transition:opacity 1.2s ease}
#hint{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 14vh);text-align:center;pointer-events:none;
  font-family:var(--font-display);font-size:clamp(22px,5.5vw,28px);font-style:italic;color:var(--ink-dim);
  letter-spacing:.02em;opacity:0;transition:opacity 2s ease;padding:0 24px;text-wrap:balance}
#hint.show{opacity:1}
#tut{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 10vh);display:flex;justify-content:center;pointer-events:none;padding:0 20px;opacity:0;transition:opacity 1.6s ease}
#tut.show{opacity:1}
#tut .card{max-width:480px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center}
#tut .step{font:13px var(--font-ui);letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint)}
#tut .text{font-family:var(--font-display);font-style:italic;font-size:clamp(27px,7vw,34px);color:var(--ink);line-height:1.35;text-wrap:balance;text-shadow:0 0 16px rgba(0,0,0,.8)}
#tut .sub{font:17px var(--font-ui);color:var(--ink-dim);line-height:1.55;max-width:36ch;text-wrap:balance}
#tut .dots{display:flex;gap:7px;margin-top:4px}
#tut .dots i{width:7px;height:7px;border-radius:50%;background:var(--ink-faint)}
#tut .dots i.on{background:var(--paper)}
#tut .nav{display:flex;gap:18px;margin-top:8px}
#tut .skip{pointer-events:auto;background:transparent;border:0;color:var(--ink-dim);font:14px var(--font-ui);letter-spacing:.14em;text-transform:uppercase;cursor:pointer;padding:12px 16px}
#tut .skip:focus-visible{outline:1px solid var(--ink-dim);outline-offset:2px}
#toast{position:fixed;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 6vh);text-align:center;pointer-events:none;
  font-family:var(--font-display);font-size:clamp(26px,6.5vw,34px);color:var(--ink);opacity:0;transition:opacity 1.4s ease;
  text-shadow:0 0 18px rgba(242,217,166,.25);padding:0 24px;text-wrap:balance}
#toast small{display:block;font-family:var(--font-ui);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim);margin-top:6px}
#toast.show{opacity:1}
body.tut-on #toast{top:auto;bottom:calc(env(safe-area-inset-bottom,0px) + 190px)}
#keep{position:fixed;left:16px;right:16px;top:calc(env(safe-area-inset-top,0px) + 16vh);display:flex;justify-content:center;opacity:0;pointer-events:none;transition:opacity .8s}
#keep.show{opacity:1;pointer-events:auto}
#keep .card{background:var(--glass);border:1px solid var(--line);border-radius:14px;padding:16px 18px;max-width:380px;width:100%;display:flex;flex-direction:column;gap:10px;align-items:center;text-align:center;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
#keep .t{font-family:var(--font-display);font-size:26px;line-height:1.2}
#keep .s{font-size:15px;color:var(--ink-dim);line-height:1.5}
#keep .row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button.b{appearance:none;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:999px;padding:11px 16px;font:14px var(--font-ui);letter-spacing:.06em;cursor:pointer;min-height:44px}
button.b.gold{color:var(--paper);border-color:rgba(242,217,166,.5)}
button.b:disabled{opacity:.45;cursor:default}
button.b:focus-visible{outline:1px solid var(--ink-dim);outline-offset:2px}
#ui{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;flex-wrap:wrap;gap:6px;
  padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);opacity:.7;transition:opacity .6s}
#ui:hover,#ui:focus-within{opacity:.95}
#ui button{appearance:none;background:rgba(4,7,14,.5);border:1px solid var(--line);color:var(--ink-dim);border-radius:999px;
  padding:10px 13px;font:14px var(--font-ui);letter-spacing:.05em;text-transform:uppercase;cursor:pointer;min-height:44px}
#ui button:focus-visible{outline:1px solid var(--ink-dim);outline-offset:2px}
#ui button[aria-pressed="true"]{color:var(--paper);border-color:rgba(242,217,166,.45)}
#ui #bShore{color:var(--paper);font-variant-numeric:tabular-nums;text-transform:none;font-size:15px}
#ui #bTonight.due::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--paper);margin-left:7px;vertical-align:middle}
#panel{position:fixed;inset:0;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 24px) 20px calc(env(safe-area-inset-bottom,0px) + 100px);
  -webkit-user-select:text;user-select:text;touch-action:pan-y}
#panel .wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
#panel h1{font-family:var(--font-display);font-weight:400;font-size:40px;margin:0;letter-spacing:.01em;text-wrap:balance;display:flex;justify-content:space-between;align-items:baseline;gap:12px}
#panel h1 small{font:15px var(--font-ui);color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
#panel h2{font:14px var(--font-ui);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim);margin:0 0 10px;font-weight:500}
#panel p{margin:0;color:var(--ink-dim);line-height:1.6;font-size:17px;max-width:60ch}
#panel p.lead{color:var(--ink);font-family:var(--font-display);font-size:22px;font-style:italic;line-height:1.4}
#panel .close{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;padding:10px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:linear-gradient(transparent,rgba(4,7,14,.9) 40%)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px}
.stat{border-top:1px solid var(--line);padding-top:10px}
.stat b{display:block;font-family:var(--font-display);font-weight:500;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim)}
.list{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.row{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);min-width:0}
.row .ic{width:34px;height:34px;flex:none;display:grid;place-items:center;border-radius:50%;border:1px solid var(--line);font-family:var(--font-display);font-size:20px;color:var(--ink-dim)}
.row.done .ic{background:rgba(159,211,168,.12);border-color:rgba(159,211,168,.5);color:var(--ok)}
.row.built .ic{color:var(--paper);border-color:rgba(242,217,166,.45)}
.row .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.row .n{font-size:18px;color:var(--ink);line-height:1.3}
.row.done .n{color:var(--ink-dim);text-decoration:line-through;text-decoration-color:var(--ink-faint)}
.row .d{font-size:14.5px;color:var(--ink-dim);line-height:1.45}
.row .pr{font-size:14px;color:var(--paper);font-variant-numeric:tabular-nums;white-space:nowrap}
.row .act{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.row .act small{font-size:12.5px;color:var(--ink-faint);white-space:nowrap}
.koi-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:10px}
.koi{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 6px;border:1px solid var(--line);border-radius:10px;min-width:0}
.koi canvas{width:72px;height:44px;display:block}
.koi span{font-size:14px;letter-spacing:.04em;color:var(--ink-dim);text-align:center;line-height:1.25}
.koi.found span{color:var(--ink)}
.koi.rare span::after{content:" ·";color:var(--paper)}
.kept{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.kept canvas{width:72px;height:44px;flex:none}
.kept input{background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:18px var(--font-ui);padding:4px 0;width:100%;min-width:0}
.kept input:focus{outline:none;border-color:var(--ink-dim)}
.kept .k{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.kept .k small{font-size:13.5px;color:var(--ink-dim)}
.swatches{display:flex;flex-wrap:wrap;gap:10px}
.sw{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-dim);border:1px solid var(--line);border-radius:999px;padding:6px 12px 6px 8px}
.sw i{width:16px;height:16px;border-radius:50%;display:inline-block;background:var(--ink-faint)}
.sw.found{color:var(--ink)}
.toggles{display:flex;flex-wrap:wrap;gap:10px}
#night{position:fixed;inset:0;display:grid;place-items:center;background:#000;pointer-events:none;opacity:0;transition:opacity 4s ease}
#night.show{opacity:1}
#night p{font-family:var(--font-display);font-style:italic;font-size:clamp(26px,6vw,34px);color:rgba(201,210,227,.35);margin:0;text-align:center;padding:0 24px}
@media (prefers-reduced-motion: reduce){#toast,#hint,#shade,#night,#tut,#keep{transition-duration:.2s}}
</style>

<canvas id="c" aria-label="A night pond. Tap the water to make ripples; hold to release a lantern; double-tap to drop a stone."></canvas>
<div id="shade"></div>
<div id="hint"></div>
<div id="tut" aria-live="polite"></div>
<div id="toast"></div>
<div id="keep"><div class="card"><div class="t" id="keepT"></div><div class="s" id="keepS"></div><div class="row"><button class="b gold" id="keepYes">Keep it</button><button class="b" id="keepNo">Let it go</button></div></div></div>
<div id="night"><p>the pond is asleep &middot; goodnight</p></div>
<div id="ui" role="toolbar" aria-label="Pond controls">
  <button id="bShore" title="Your light. Spend it on the shore.">&#10022; 0</button>
  <button id="bTonight">Tonight</button>
  <button id="bJournal">Journal</button>
  <button id="bMore">More</button>
</div>
<div id="panel" hidden>
  <div class="wrap" id="panelWrap"></div>
  <div class="close"><button class="b" id="bClose">Back to the pond</button></div>
</div>
<script>
(function(){
'use strict';
// ---------- helpers ----------
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const TAU=Math.PI*2;
const now=()=>performance.now();
const reduceMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function hashStr(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return (h>>>0);}
function seeded(seed){let x=seed||1;return()=>{x^=x<<13;x^=x>>>17;x^=x<<5;return ((x>>>0)%100000)/100000;};}

// A "night" runs from 6am to 6am, so a 1am session is still the same night as the evening before.
const nightKey=(d=new Date())=>{const t=new Date(d.getTime()-6*3600e3);return t.getFullYear()+'-'+(t.getMonth()+1)+'-'+t.getDate();};
const isQuietHour=()=>{const h=new Date().getHours();return h>=23||h<5;};

// ---------- persistence ----------
const KEY='lantern-pond-v1';
const defaults=()=>({v:2,lotuses:[],koi:{},nights:[],lanterns:0,sound:true,soundV2:true,dim:1,visits:0,tut:false,
  glow:0,built:{},kept:[],wishes:null,shoreLit:0,lastSeen:0,colours:{},stones:[],float:null,pods:[],fry:null,bellAt:0,glowTotal:0});
let save=defaults();
try{const raw=localStorage.getItem(KEY);if(raw){save=Object.assign(defaults(),JSON.parse(raw));}}catch(e){}
if(!save.soundV2){save.sound=true;save.soundV2=true;}
if(!save.built)save.built={};if(!Array.isArray(save.kept))save.kept=[];if(!Array.isArray(save.stones))save.stones=[];if(!Array.isArray(save.pods))save.pods=[];
function persist(){try{localStorage.setItem(KEY,JSON.stringify(save));}catch(e){}}
const TONIGHT=nightKey();
const firstVisitTonight=!save.nights.includes(TONIGHT);
if(firstVisitTonight){save.nights.push(TONIGHT);if(save.nights.length>400)save.nights.shift();}
save.visits++;
function streak(){const set=new Set(save.nights);let n=0;const d=new Date();for(;;){const k=nightKey(d);if(set.has(k)){n++;d.setDate(d.getDate()-1);}else break;}return n;}

// ---------- koi species (the collection) ----------
const SPECIES=[
 {id:'shadow',d:'a dark grey koi',n:'Shadow koi',body:'#262b3a',marks:null,w:10},
 {id:'kohaku',d:'white with red patches',n:'Kohaku',body:'#e9e3d6',marks:'#b8432b',w:8},
 {id:'bekko',d:'white with black spots',n:'Bekko',body:'#e3ddd0',marks:'#1c1b22',w:7},
 {id:'chagoi',d:'plain brown, big and friendly',n:'Chagoi',body:'#7f6c48',marks:null,w:7},
 {id:'ogon',d:'solid gold',n:'Ogon',body:'#d6b25c',marks:null,w:6},
 {id:'asagi',d:'blue-grey with red under the belly',n:'Asagi',body:'#5d7ca6',marks:'#b8432b',belly:true,w:6},
 {id:'showa',d:'black with red and white patches',n:'Showa',body:'#1c1b22',marks:'#b8432b',marks2:'#e9e3d6',w:5},
 {id:'sanke',d:'white with red and black patches',n:'Sanke',body:'#e9e3d6',marks:'#b8432b',marks2:'#1c1b22',w:5},
 {id:'shusui',d:'pale blue with a red stripe',n:'Shusui',body:'#6f8db5',marks:'#c5503a',w:5},
 {id:'kumonryu',d:'white with black cloud shapes',n:'Kumonryu',body:'#e6e2da',marks:'#15141a',w:4},
 {id:'ochiba',d:'grey with brown leaf shapes',n:'Ochiba',body:'#8a9aa6',marks:'#8a6a3a',w:4},
 {id:'ginrin',d:'silver and sparkly',n:'Gin rin',body:'#cdd5df',marks:null,sparkle:true,w:3},
 {id:'tancho',d:'white with one red spot on its head',n:'Tancho',body:'#ece7dc',marks:null,tancho:'#b8432b',w:3},
 {id:'karasu',d:'all black',n:'Karasu',body:'#0e0f16',marks:null,w:3},
 {id:'benigoi',d:'all red',n:'Benigoi',body:'#b0392a',marks:null,w:3},
 {id:'kujaku',d:'silver with orange and sparkles',n:'Kujaku',body:'#d8dde6',marks:'#d08a3c',sparkle:true,w:2},
 {id:'moon',d:'pale and softly glowing',n:'Moon koi',body:'#dfe7f7',marks:null,glow:'#bcd0ff',w:1.5,quiet:true},
 {id:'ember',d:'dark with glowing orange',n:'Ember koi',body:'#3a1a12',marks:'#ff8a4a',glow:'#ff9a5a',w:1.2},
 {id:'willow',d:'green with pale leaf marks',n:'Willow koi',body:'#5f7a5a',marks:'#a7c49a',w:1.2},
 {id:'ink',d:'deep blue and glowing',n:'Ink koi',body:'#121a2a',marks:'#3b4e7a',glow:'#4b63a0',w:1,quiet:true},
 {id:'star',d:'midnight blue with sparkles',n:'Star koi',body:'#0f1630',marks:null,sparkle:true,glow:'#9fb4ff',w:.6,quiet:true},
 {id:'ghost',d:'pale and see-through',n:'Ghost koi',body:'#8e97a8',marks:'#f0f2f6',glow:'#dfe6f5',w:.5},
];
const SP=Object.fromEntries(SPECIES.map(s=>[s.id,s]));
const keepCost=sp=>sp.w>=5?20:sp.w>=2?30:40;
function pickSpecies(rareBias=1){
  const quiet=isQuietHour();
  const pool=SPECIES.map(s=>({s,w:Math.pow(s.w,1/rareBias)*(s.quiet?(quiet?3:.25):1)*(save.koi[s.id]?.6:1)}));
  let tot=pool.reduce((a,p)=>a+p.w,0),r=Math.random()*tot;
  for(const p of pool){r-=p.w;if(r<=0)return p.s;}
  return SPECIES[0];
}
const KOI_NAMES=['Pebble','Juniper','Moth','Ember','Willow','Marlow','Tansy','Oboe','Fennel','Quill','Sorrel','Nimbus','Bramble','Lumen','Clove','Wren','Haze','Tide','Mochi','Pip'];

// ---------- lotus colours ----------
const COLOURS=[
 {id:'amber',n:'Amber',h:36},{id:'rose',n:'Rose',h:352},{id:'peach',n:'Peach',h:18},{id:'gold',n:'Gold',h:48},
 {id:'sky',n:'Sky',h:200},{id:'violet',n:'Violet',h:276},{id:'jade',n:'Jade',h:160},{id:'silver',n:'Silver',h:-1,rare:true},{id:'ink',n:'Ink',h:-2,rare:true},
];
const HUES=[36,352,18,48,200,276,160];
function colourOf(l){if(l.silver)return 'silver';if(l.ink)return 'ink';let best='amber',bd=999;for(const c of COLOURS){if(c.h<0)continue;let d=Math.abs(((l.hue-c.h)%360+540)%360-180);if(d<bd){bd=d;best=c.id;}}return best;}
// ---------- audio ----------
// Warm, woolly bed: five detuned low voices that swell on their own slow tides (20-40 s),
// drifting between four related chords. A dark generated reverb washes everything.
// Distant rain is filtered noise that gusts slowly. Player sounds pick chord tones so nothing clashes.
let AC=null,master=null,reverb=null,padBus=null,rainGain=null,padGain=null;
const SCALE=new Array(10).fill(0); // length only: input maps y to one of ten chord tones
const CHORDS=[
  [98.00,146.83,196.00,246.94,293.66],  // G  D  G  B  D
  [82.41,123.47,196.00,246.94,329.63],  // E  B  G  B  E
  [65.41,130.81,196.00,246.94,293.66],  // C  C  G  B  D
  [73.42,146.83,220.00,293.66,329.63],  // D  D  A  D  E
];
let chordI=0,voices=[],audioTimers=[];
function chordTones(){const c=CHORDS[chordI];const t=[];for(const f of c){t.push(f*2,f*4);}t.sort((a,b)=>a-b);return t.filter(f=>f>=150&&f<=900).slice(0,10);}
function makeReverb(){
  const len=Math.floor(AC.sampleRate*4.2),buf=AC.createBuffer(2,len,AC.sampleRate);
  for(let ch=0;ch<2;ch++){const d=buf.getChannelData(ch);let lp=0;
    for(let i=0;i<len;i++){const t=i/len;const env=Math.pow(1-t,2.2)*Math.exp(-t*2.5);
      lp+=( (Math.random()*2-1)-lp)*.18; // one-pole lowpass: darker tail
      d[i]=lp*env*(i<400?i/400:1);}}
  const c=AC.createConvolver();c.buffer=buf;return c;
}
function makeNoise(){
  const len=AC.sampleRate*4,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
  let b0=0,b1=0,b2=0;for(let i=0;i<len;i++){const w=Math.random()*2-1;b0=.997*b0+.029*w;b1=.985*b1+.032*w;b2=.95*b2+.048*w;d[i]=(b0+b1+b2+w*.05)*.6;} // pinkish
  const s=AC.createBufferSource();s.buffer=buf;s.loop=true;return s;
}
function ensureAudio(){
  if(AC)return true;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const comp=AC.createDynamicsCompressor();comp.threshold.value=-24;comp.knee.value=18;comp.ratio.value=3;comp.attack.value=.05;comp.release.value=.6;
    master=AC.createGain();master.gain.value=0;master.connect(comp);comp.connect(AC.destination);
    reverb=makeReverb();const rv=AC.createGain();rv.gain.value=.9;reverb.connect(rv);rv.connect(master);
    // pad bus with a slow-breathing lowpass
    padBus=AC.createBiquadFilter();padBus.type='lowpass';padBus.frequency.value=520;padBus.Q.value=.5;
    const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=.017;lg.gain.value=160;lfo.connect(lg);lg.connect(padBus.frequency);lfo.start();
    padGain=AC.createGain();padGain.gain.value=1;padBus.connect(padGain);padGain.connect(master);

      const g=AC.createGain();g.gain.value=0;f.connect(g);g.connect(padBus);

function scheduleTides(){
  voices.forEach((v,i)=>{const go=()=>{if(!AC)return;const t=AC.currentTime;
    const up=rnd(10,20),hold=rnd(4,14),down=rnd(12,22),rest=rnd(4,16);
    const peak=rnd(.035,.07)*(i<2?.9:1);
    // retune while quiet so the glide is inaudible

    v.g.gain.cancelScheduledValues(t);v.g.gain.setValueAtTime(Math.max(.0001,v.g.gain.value),t);
    v.g.gain.linearRampToValueAtTime(peak,t+up);v.g.gain.setValueAtTime(peak,t+up+hold);v.g.gain.linearRampToValueAtTime(.0001,t+up+hold+down);

}

      if(r<.22){k.mode='rest';k.modeT=rnd(3,6);}else if(r<.36){k.mode='mouth';k.modeT=3;k.mouthed=false;}}

    if(k.modeT<0){k.mode='cruise';k.modeT=rnd(5,11);}
  }else if(k.mode==='curious'){
    if(!near){k.mode='cruise';k.modeT=rnd(5,11);}

  k.vis=lerp(k.vis,target,dt*(target>k.vis?1.2:.5));

}

// ---------- update ----------
let podTimer=0;
function update(dt){
  const t=simT;
  // lanterns
  for(let i=lanterns.length-1;i>=0;i--){const l=lanterns[i];
    const c=current(l.x,l.y,t);const m=moon();l.onPath=!!(m&&built('moongate')&&Math.abs(l.x-m.x)<.045&&l.y>m.y);
    l.x+=(c.vx+l.vx)*dt;l.y+=(c.vy+l.vy)*dt;const dmp=Math.exp(-1.6*dt);l.vx*=dmp;l.vy*=dmp;
    l.ph+=dt*.9;l.bob*=Math.pow(.2,dt);
    if(l.y>waterBottom()-.01){l.y=waterBottom()-.01;l.vy=-.012;}
    if(l.y<.02){l.y=.02;l.vy=.004;}
    l.alpha=lerp(l.alpha,l.leaving?0:1,dt*.8);
    if(!l.leaving&&!l.crossed&&l.x>.95){l.crossed=true;wish('cross');}
    if(l.x<-.06||l.x>1.05||l.y<-.08)l.leaving=true;
    if(l.leaving&&l.alpha<.02){lanterns.splice(i,1);continue;}
    if(!l.leaving){l.earnT+=dt;if(l.earnT>=20){l.earnT-=20;gainGlow(l.onPath?2:1,l.x,l.y);}}
    if(!l.planted&&t-l.born>l.settle){l.planted=true;if(inWater(l.x,l.y)&&l.x>.04&&l.x<.94){plantLotus(l);l.leaving=true;}}
    if(save.float&&!save.float.lit&&!l.leaving&&Math.hypot((l.x-save.float.x)*W,(l.y-save.float.y)*H)<Smin*.045)lightFloat(l);
  }
  // ripples
  for(let i=ripples.length-1;i>=0;i--){const r=ripples[i];const age=t-r.born;r.r+=r.speed*dt;
    if(age>r.life){ripples.splice(i,1);continue;}
    for(const l of lanterns){const dx=(l.x-r.x)*W,dy=(l.y-r.y)*H,d=Math.hypot(dx,dy)/Smin;
      if(!r.hit.has(l.id)&&Math.abs(d-r.r)<.012&&d>.015){r.hit.add(l.id);l.bob+=.9*r.big;chime((1-l.y)*SCALE.length+2,.3*r.big+.1,3);
        if(r.push>0){l.vx+=dx/(d*Smin)*.09*r.push*Smin/W;l.vy+=dy/(d*Smin)*.09*r.push*Smin/H;wish('ring');tutEvent('ring');}}}
    if(r.push>0)for(const k of koi){const d=Math.hypot((k.x-r.x)*W,(k.y-r.y)*H)/Smin;
      if(!r.hit.has(k)&&Math.abs(d-r.r)<.015){r.hit.add(k);
        if(k.vis>.4&&k.mode!=='rise'){startRise(k);}else if(k.mode==='cruise'&&Math.random()<.5){k.mode='rest';k.modeT=1.2;}}}
  }
  // koi
  for(let i=koi.length-1;i>=0;i--){const k=koi[i];koiStep(k,dt,t);
    if(k.x<-.2||k.x>1.2){koi.splice(i,1);}}
  while(koi.length<wantedKoi())spawnKoi();
  if(koi.length>wantedKoi()&&Math.random()<dt*.02){const k=koi.find(k=>k.mode==='cruise');if(k){k.tx=k.x<.5?-.15:1.15;k.modeT=30;}}
  for(const p of pets){koiStep(p,dt,t);p.x=clamp(p.x,.03,.97);}
  // fireflies
  for(let i=flies.length-1;i>=0;i--){const f=flies[i];f.ph+=dt*f.sp;f.x+=Math.sin(f.ph*.7+f.sp)*dt*.01;f.y+=Math.cos(f.ph*.5)*dt*.008-dt*.002;
    if(f.life<1){f.life-=dt*.12;if(f.life<=0){flies.splice(i,1);continue;}}
    if(f.y<-.05)f.y=1.05;if(f.x<-.05)f.x=1.05;if(f.x>1.05)f.x=-.05;}
  // motes of light drifting to the jar
  const j=jarPos();
  for(let i=motes.length-1;i>=0;i--){const m=motes[i];m.t+=dt/1.3;if(m.t<0)continue;const u=Math.min(1,m.t),e=u*u*(3-2*u);

  if(rainNight()&&Math.random()<dt*5){addRipple(rnd(.02,.98),rnd(.02,waterBottom()-.02),.28,false,0);}
  rainMul=rainNight()?2.4:1;
  podTimer+=dt;if(podTimer>30){podTimer=0;checkPods();}
}

  for(const p of pts)x.lineTo(p[0],p[1]-p[2]);const tl=pts[12];x.lineTo(tl[0]-L*.26,tl[1]-L*.17);x.lineTo(tl[0]-L*.14,tl[1]);x.lineTo(tl[0]-L*.26,tl[1]+L*.17);

    for(let i=0;i<9;i++){const x=W*.04+i*W*.012;const hgt=26+((i*37)%22);const sw=Math.sin(t*.6+i)*4;ctx.beginPath();ctx.moveTo(x,shoreTop+28);ctx.quadraticCurveTo(x+sw*.5,shoreTop+28-hgt*.5,x+sw,shoreTop+28-hgt);ctx.stroke();}}

    ctx.fillStyle='rgba(140,150,170,.35)';for(let i=0;i<5;i++){ctx.beginPath();ctx.ellipse(W*.22-40+i*20,shoreTop+22+(i%2)*4,5,3,0,0,TAU);ctx.fill();}}
  // shore lanterns
  for(let i=0;i<14;i++){const x=W*(.1+.8*i/13),y=shoreTop+30,lit=i<save.shoreLit;
    if(lit){ctx.save();ctx.globalCompositeOperation='lighter';const gg=ctx.createRadialGradient(x,y-6,0,x,y-6,26);gg.addColorStop(0,'rgba(255,200,120,.35)');gg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gg;ctx.beginPath();ctx.arc(x,y-6,26,0,TAU);ctx.fill();ctx.restore();}
    ctx.fillStyle=lit?'#3a3630':'#1a1f2b';ctx.fillRect(x-1.5,y-4,3,12);ctx.beginPath();ctx.moveTo(x-6,y-6);ctx.lineTo(x,y-12);ctx.lineTo(x+6,y-6);ctx.closePath();ctx.fill();

  if(built('bell')){const x=W*.9,y=shoreTop+16,hum=simT-(save.bellAt||0)<2?Math.sin(simT*30)*2:0;ctx.strokeStyle='#2a3142';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(x-16,y+20);ctx.lineTo(x-16,y-4);ctx.lineTo(x+16,y-4);ctx.lineTo(x+16,y+20);ctx.stroke();
    ctx.fillStyle='#8a7a52';ctx.beginPath();ctx.moveTo(x-8+hum,y+14);ctx.quadraticCurveTo(x-9+hum,y,x+hum,y-2);ctx.quadraticCurveTo(x+9+hum,y,x+8+hum,y+14);ctx.closePath();ctx.fill();ctx.fillStyle='#5a4e34';ctx.fillRect(x-9+hum,y+13,18,2);}
  // rain charm: a small paper strip on the gate post or a stake
  if(built('rain')){const x=W*.62;ctx.fillStyle='#2a3142';ctx.fillRect(x-1,shoreTop+10,2,26);ctx.fillStyle=rainNight()?'rgba(190,210,240,.8)':'rgba(190,210,240,.35)';ctx.fillRect(x+1,shoreTop+12,7,12);}

function draw(){
  const t=simT;

  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  ctx.save();ctx.globalCompositeOperation='lighter';
  for(let i=0;i<3;i++){const mx=W*(.5+.45*Math.sin(t*.013+i*2.1)),my=H*(.3+.5*Math.cos(t*.011+i*1.3));
    const mg=ctx.createRadialGradient(mx,my,0,mx,my,Math.max(W,H)*.45);mg.addColorStop(0,'rgba(60,80,120,.05)');mg.addColorStop(1,'rgba(0,0,0,0)');

    ctx.strokeStyle=`rgba(170,195,230,${al})`;ctx.beginPath();ctx.ellipse(r.x*W,r.y*H,R,R*.6,0,0,TAU);ctx.stroke();
    if(R>12&&r.big>=.3){ctx.strokeStyle=`rgba(170,195,230,${al*.45})`;ctx.beginPath();ctx.ellipse(r.x*W,r.y*H,R*.62,R*.37,0,0,TAU);ctx.stroke();}}
  for(const lo of lotuses)drawLotus(lo,t);
  for(const p of save.pods)drawPod(p,t);
  if(save.float&&built('stones'))drawFloat(save.float,t);
  for(const l of lanterns)drawLantern(l,t);
  ctx.save();ctx.globalCompositeOperation='lighter';
  for(const f of flies){const a=(.35+.65*Math.max(0,Math.sin(f.ph*1.3)))*.7*Math.min(1,f.life);const x=f.x*W,y=f.y*H;
    const fg=ctx.createRadialGradient(x,y,0,x,y,7);fg.addColorStop(0,`rgba(214,236,160,${a})`);fg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=fg;ctx.beginPath();ctx.arc(x,y,7,0,TAU);ctx.fill();}
  for(const m of motes){if(m.t<0)continue;const x=m.x*W,y=m.y*H;const fg=ctx.createRadialGradient(x,y,0,x,y,9);fg.addColorStop(0,'rgba(255,225,160,.9)');fg.addColorStop(.4,'rgba(255,200,120,.35)');fg.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=fg;ctx.beginPath();ctx.arc(x,y,9,0,TAU);ctx.fill();}
  ctx.restore();
  drawShore(t);
  const v=ctx.createRadialGradient(W/2,H/2,Smin*.35,W/2,H/2,Math.max(W,H)*.75);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.55)');
  ctx.fillStyle=v;ctx.fillRect(0,0,W,H);
}
// ---------- loop ----------
let running=true,asleep=false,hidden=false;
function loop(){
  if(!running)return;
  const tn=now();let dt=Math.min(.1,(tn-tPrev)/1000);tPrev=tn;
  if(reduceMotion)dt*=.6;
  dt*=slow;simT+=dt;
  update(dt);
  if(!hidden&&!(frame++%(slow<.5?2:1)))draw();
  requestAnimationFrame(loop);
}

 {t:'Touch the water.',s:'Every ripple plays a note.',wait:'tap'},

 {t:'Tap just behind the lantern.',s:'Ripples push whatever they reach. This is how you steer.',wait:'ring'},

    '<div class="dots">'+TUT.map((_,k)=>'<i'+(k<=tut.i?' class="on"':'')+'></i>').join('')+'</div>'+

function tutArm(){clearTimeout(tut.timer);const w=TUT[tut.i].wait;if(typeof w==='number')tut.timer=setTimeout(tutNext,w);}
function tutNext(){if(!tut.on)return;clearTimeout(tut.timer);

let press=null,lastTap=null;const HOLD=460;
function pos(e){return {x:clamp(e.clientX/W,0,1),y:clamp(e.clientY/H,0,1)};}
cv.addEventListener('pointerdown',e=>{
  if(asleep){wake();return;}
  if(save.sound&&AC&&AC.state==='suspended')AC.resume();
  const p=pos(e);press={x:p.x,y:p.y,sx:e.clientX,sy:e.clientY,t:now(),moved:false,lastX:e.clientX,lastY:e.clientY,stirred:false,
    timer:setTimeout(()=>{if(press&&!press.moved&&inWater(press.x,press.y)){press.done=true;releaseLantern(press.x,press.y);}},HOLD)};
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  if(!press||press.done)return;
  const d=Math.hypot(e.clientX-press.sx,e.clientY-press.sy);
  if(d>10){press.moved=true;clearTimeout(press.timer);}
  if(press.moved&&Math.hypot(e.clientX-press.lastX,e.clientY-press.lastY)>38){press.lastX=e.clientX;press.lastY=e.clientY;
    const p=pos(e);if(!inWater(p.x,p.y))return;addRipple(p.x,p.y,.35,Math.random()<.35,.25);
    if(!press.stirred){press.stirred=true;wish('stir');}
    for(const k of koi){const dd=Math.hypot((k.x-p.x)*W,(k.y-p.y)*H);if(dd<90&&k.mode!=='rise'){k.a=Math.atan2((k.y-p.y)*H,(k.x-p.x)*W);k.mode='cruise';const w=waypoint();k.tx=w.x;k.ty=w.y;k.modeT=rnd(5,9);}}}
});
function endPress(e){
  if(!press)return;clearTimeout(press.timer);
  const p=press;press=null;
  if(p.done||p.moved)return;
  const px=p.x*W,py=p.y*H,tn=now();
  // shore taps
  if(py>shoreTop-10){
    if(built('reeds')&&px<W*.18){for(let i=0;i<6;i++)flies.push({x:p.x+rnd(-.02,.02),y:(shoreTop-20)/H,ph:rnd(TAU),sp:rnd(.6,1.2),life:.99});if(flies.length>40)flies.splice(0,flies.length-40);chime(7,.3,3);return;}
    if(built('bell')&&px>W*.82){ringBell();return;}
    if(built('hollow')&&px>W*.1&&px<W*.34){toast(save.kept.length?'Your koi: '+save.kept.map(k=>k.name).join(', '):'No koi live here yet','keep one when it comes up');return;}
    return;
  }
  // double-tap: stone
  if(lastTap&&tn-lastTap.t<360&&Math.hypot(px-lastTap.x,py-lastTap.y)<34){lastTap=null;
    if(built('stones')){toggleStone(p.x,p.y);return;}
  }
  lastTap={x:px,y:py,t:tn};
  // a koi you keep: feed it
  for(const k of pets){const d=Math.hypot(k.x*W-px,k.y*H-py);if(d<44){feedPet(k);return;}}
  // lotus
  let hit=null,hd=34;for(const lo of lotuses){const d=Math.hypot(lo.x*W-px,lo.y*H-py);if(d<hd){hd=d;hit=lo;}}
  if(hit){chord((1-hit.y)*SCALE.length-2);addRipple(hit.x,hit.y,.6,false,0);
    for(let i=0;i<4;i++)flies.push({x:hit.x+rnd(-.01,.01),y:hit.y+rnd(-.01,.01),ph:rnd(TAU),sp:rnd(.6,1.2),life:.99});
    if(flies.length>40)flies.splice(0,flies.length-40);
    if(lotusStage(hit)>=1){wish('lotus');if(hit.tapped!==TONIGHT){hit.tapped=TONIGHT;gainGlow(1,hit.x,hit.y);persist();}}
    return;}
  // lantern itself: a small bob, no push
  for(const l of lanterns){const d=Math.hypot(l.x*W-px,l.y*H-py);if(d<26){l.bob+=1.4;chime((1-l.y)*SCALE.length+3,.6,3);addRipple(l.x,l.y,.5,false,0);return;}}
  addRipple(p.x,p.y,1,true,1);tutEvent('tap');
}

    h+='<div><h2>Koi you have seen · '+found+' of '+SPECIES.length+'</h2><p>Koi like lantern light. One that stays under a lantern shows its colours. Tap the water next to it and it comes up. Some only come out late at night.</p><div class="koi-grid" id="koiGrid"></div></div>';
    h+='<div><h2>Lotus colours · '+cols+' of '+COLOURS.length+'</h2><p>A lotus is the same colour as the lantern it came from. '+(built('pods')?'Two open lotuses close together can make a seed with a mixed colour.':'Something on the shore can mix them.')+'</p><div class="swatches">'+COLOURS.map(c=>'<span class="sw'+(save.colours[c.id]?' found':'')+'"><i style="'+(save.colours[c.id]?(c.h>=0?'background:hsl('+c.h+',60%,72%)':c.id==='silver'?'background:#e2e8f5':'background:#4a5f94'):'')+'"></i>'+(save.colours[c.id]?c.n:'· · ·')+'</span>').join('')+'</div></div>';
  }else if(kind==='more'){
    h+='<h1>More</h1><div class="toggles">'+
      '<button class="b'+(save.sound?' gold':'')+'" id="mSound">Sound '+(save.sound?'on':'off')+'</button>'+
      '<button class="b" id="mDim">Dim: '+['off','a little','more','most'][save.dim]+'</button>'+
      '<button class="b'+(candle?' gold':'')+'" id="mCandle">'+(candle?'Relight the candle':'Light the candle')+'</button>'+
      '<button class="b" id="mTour">Show me how to play</button></div>'+
      '<p>Sound is slow and soft, with faraway rain. It starts when you first touch the water. The candle slowly fades the pond to black over ten minutes so you can fall asleep with it.</p>'+
      '<div><h2>Start over</h2><p>Clears everything: light, koi, lotuses and the shore.</p><div class="toggles" style="margin-top:10px"><button class="b" id="mReset">Reset the pond</button></div></div>';
  }
  wrap.innerHTML=h;
  if(kind==='journal'){
    const kl=$('keptList');if(kl)for(const k of save.kept){const d=document.createElement('div');d.className='kept';d.appendChild(miniKoi(SP[k.sp],true,k.young?.6:1));
      const box=document.createElement('div');box.className='k';const inp=document.createElement('input');inp.value=k.name;inp.maxLength=18;inp.setAttribute('aria-label','Name of this koi');inp.id='name-'+k.name.replace(/\W/g,'');
      inp.addEventListener('change',()=>{k.name=inp.value.trim()||k.name;inp.value=k.name;persist();});box.appendChild(inp);
      const sm=document.createElement('small');sm.textContent=SP[k.sp].n+', '+SP[k.sp].d+(k.young?' · still small':'');box.appendChild(sm);d.appendChild(box);kl.appendChild(d);}
    const grid=$('koiGrid');for(const sp of SPECIES){const f=!!save.koi[sp.id];const d=document.createElement('div');d.className='koi'+(f?' found':'')+(sp.w<2?' rare':'');
      d.appendChild(miniKoi(sp,f));const s=document.createElement('span');s.textContent=f?sp.n:'· · ·';d.appendChild(s);grid.appendChild(d);}
  }
  if(kind==='shore'){wrap.querySelectorAll('[data-build]').forEach(b=>b.addEventListener('click',()=>{const it=SHORE.find(s=>s.id===b.dataset.build);
    if(!spendGlow(it.cost)){toast('Not enough light yet');return;}save.built[it.id]=true;persist();
    if(it.id==='stones'&&(!save.float||save.float.night!==TONIGHT)){const r=seeded(hashStr(TONIGHT+'float'));save.float={night:TONIGHT,x:.62+r()*.28,y:.15+r()*.4,lit:false};}
    if(it.id==='reeds')for(let i=0;i<10;i++)flies.push({x:rnd(.03,.2),y:rnd(.6,.85),ph:rnd(TAU),sp:rnd(.4,1),life:1});
    persist();openPanel('shore');toast(it.n+' built',{reeds:'they sway at the left end of the shore',stones:'double-tap the water to drop one',hollow:'you can keep the next koi that comes up',moongate:'look for the moon path in the evening',rain:'rain comes on some nights',pods:'let two open lotuses grow near each other',shrine:'koi stay longer in the light',bell:'tap it at the right end of the shore'}[it.id]);}));}
  if(kind==='more'){
    $('mSound').addEventListener('click',()=>{setSound(!save.sound);openPanel('more');});
    $('mDim').addEventListener('click',()=>{save.dim=(save.dim+1)%DIMS.length;persist();applyDim();openPanel('more');});
    $('mCandle').addEventListener('click',()=>{toggleCandle();closePanel();});
    $('mTour').addEventListener('click',()=>{closePanel();tutStart();});
    $('mReset').addEventListener('click',()=>{const b=$('mReset');if(b.dataset.arm){try{localStorage.removeItem(KEY);}catch(e){}location.reload();}else{b.dataset.arm='1';b.textContent='Tap again to really reset';}});
  }
  $('panel').hidden=false;$('panel').scrollTop=0;
}
function closePanel(){$('panel').hidden=true;}
$('bClose').addEventListener('click',closePanel);
$('bShore').addEventListener('click',()=>openPanel('shore'));
$('bTonight').addEventListener('click',()=>openPanel('tonight'));
$('bJournal').addEventListener('click',()=>openPanel('journal'));
$('bMore').addEventListener('click',()=>openPanel('more'));

// ---------- boot ----------
applyDim();updateBar();
addEventListener('pointerdown',function arm(){if(save.sound)setSound(true);removeEventListener('pointerdown',arm);},{once:true});
if(built('reeds'))for(let i=0;i<14;i++)flies.push({x:rnd(.03,.2),y:rnd(.5,.85),ph:rnd(TAU),sp:rnd(.4,1),life:1});
else for(let i=0;i<6;i++)flies.push({x:rnd(),y:rnd(.1,.8),ph:rnd(TAU),sp:rnd(.4,1),life:1});
if(!save.tut)setTimeout(tutStart,1400);
else{const grown=lotuses.filter(l=>lotusStage(l)>=1).length;setTimeout(()=>{if(!$('toast').classList.contains('show'))toast(firstVisitTonight?'Welcome back':'The pond is waiting',firstVisitTonight?'three new things to try tonight':'');},1200);}
requestWake();
requestAnimationFrame(loop);
window.__pond={save,lanterns,koi,pets,lotuses,ripples,gainGlow,wish,startRise,releaseLantern,dbg,openPanel,get simT(){return simT;},moon,makeWishes,persist,step:(s)=>{for(let i=0;i<s*30;i++){simT+=1/30;update(1/30);}}};
})();
</script>
</body>
</html>
